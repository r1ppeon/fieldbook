<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMAD</title>
<style>
  :root { --bg:#10141a; --card:#1a212b; --text:#e8edf4; --dim:#8b97a8; --accent:#e8a33d; --ok:#4cc38a; --bad:#e5534b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f1ea; --card:#ffffff; --text:#1d2733; --dim:#5b6878; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 -apple-system, "SF Pro Text", Helvetica, sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:34px; margin:0; letter-spacing:.5px; }
  h1 .flag { color:var(--accent); }
  .tag { color:var(--dim); margin:4px 0 28px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .grid { grid-template-columns:1fr; } }
  a.card { display:block; background:var(--card); border-radius:14px; padding:22px; text-decoration:none; color:var(--text); border:1px solid rgba(128,128,128,.15); }
  a.card:hover { border-color:var(--accent); }
  .card h2 { margin:0 0 6px; font-size:20px; }
  .card p { margin:0; color:var(--dim); font-size:14px; }
  .status { background:var(--card); border-radius:14px; padding:18px 22px; margin-top:16px; border:1px solid rgba(128,128,128,.15); }
  .light { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; background:var(--bad); }
  .light.on { background:var(--ok); }
  .row { margin:6px 0; font-size:15px; }
  .books { margin-top:10px; color:var(--dim); font-size:14px; }
  .books li { margin:2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="flag">⬢</span> NOMAD</h1>
  <p class="tag">Your offline knowledge base &amp; AI — no internet required.</p>

  <div class="grid">
    <a class="card" href="/chat.html">
      <h2>💬 Ask the Librarian</h2>
      <p>Chat with a local AI that searches your offline library and cites its sources.</p>
    </a>
    <a class="card" id="librarylink" href="#" target="_blank">
      <h2>📚 Browse the Library</h2>
      <p>Read Wikipedia, medical references, and survival guides directly.</p>
    </a>
  </div>

  <div class="status">
    <div class="row"><span class="light" id="l-kiwix"></span>Library server</div>
    <div class="row"><span class="light" id="l-ollama"></span>AI engine <span id="model" style="color:var(--dim)"></span></div>
    <ul class="books" id="books"></ul>
  </div>
</div>
<script>
async function refresh() {
  try {
    const s = await (await fetch('/api/status')).json();
    document.getElementById('l-kiwix').classList.toggle('on', s.kiwix);
    document.getElementById('l-ollama').classList.toggle('on', s.ollama);
    document.getElementById('model').textContent = '(' + s.model + ')';
    document.getElementById('librarylink').href = 'http://' + location.hostname + ':' + s.kiwix_port;
    const ul = document.getElementById('books');
    ul.innerHTML = s.books.length
      ? s.books.map(b => '<li>' + b.title + '</li>').join('')
      : '<li>No knowledge packs yet — run <code>./nomad library</code> in Terminal.</li>';
  } catch (e) { /* app starting up */ }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
