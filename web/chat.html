<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldbook Librarian</title>
<style>
  :root { --bg:#10141a; --card:#1a212b; --text:#e8edf4; --dim:#8b97a8; --accent:#e8a33d; --user:#2b3a50; --bad:#e5534b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f1ea; --card:#ffffff; --text:#1d2733; --dim:#5b6878; --user:#dbe7f5; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,"SF Pro Text",Helvetica,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:14px 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(128,128,128,.15); }
  header a { color:var(--dim); text-decoration:none; font-size:14px; }
  header b { font-size:17px; } header b span { color:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:20px 16px; }
  .inner { max-width:760px; margin:0 auto; }
  .msg { padding:12px 16px; border-radius:14px; margin:10px 0; white-space:normal; overflow-wrap:break-word; }
  .user { background:var(--user); margin-left:15%; }
  .bot  { background:var(--card); margin-right:5%; border:1px solid rgba(128,128,128,.12); }
  .bot p { margin:.5em 0; } .bot ol,.bot ul { margin:.4em 0; padding-left:1.4em; }
  .status { color:var(--dim); font-style:italic; font-size:14px; margin:6px 4px; }
  .error { color:var(--bad); }
  .unverified { margin-top:10px; font-size:13px; color:var(--dim); border-top:1px dashed rgba(128,128,128,.3); padding-top:8px; }
  .sources { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
  .sources a { font-size:13px; color:var(--accent); border:1px solid var(--accent); border-radius:20px;
               padding:3px 12px; text-decoration:none; }
  form { display:flex; gap:10px; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid rgba(128,128,128,.15); }
  form .inner { flex:1; display:flex; gap:10px; max-width:760px; margin:0 auto; width:100%; }
  textarea { flex:1; resize:none; border-radius:12px; border:1px solid rgba(128,128,128,.3); background:var(--card);
             color:var(--text); padding:11px 14px; font:inherit; height:48px; }
  button { background:var(--accent); color:#1d1405; border:0; border-radius:12px; padding:0 20px; font:600 15px/1 inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header><a href="/">← Fieldbook</a><b><span>⬢</span> Librarian</b></header>
<div id="log"><div class="inner" id="loginner">
  <div class="msg bot">I'm your offline librarian. Ask me anything — survival, first aid, repairs,
  or general questions — and I'll search the knowledge library on this Mac to answer. No internet needed.</div>
</div></div>
<form id="f"><div class="inner">
  <textarea id="q" placeholder="e.g. How do I treat a deep cut when I can't reach a doctor?" rows="1"></textarea>
  <button id="send">Ask</button>
</div></form>
<script>
const history = [];
const log = document.getElementById('loginner');
const q = document.getElementById('q');
const send = document.getElementById('send');

function el(cls, html) {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html;
  log.appendChild(d);
  d.scrollIntoView({block:'end'});
  return d;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){ // tiny markdown: bold, code, lists, paragraphs
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/^###? (.+)$/gm,'<b>$1</b>');
  h = h.replace(/^\s*[-*] (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, m=>'<ul>'+m+'</ul>');
  h = h.replace(/^\s*\d+\. (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, m=> m.startsWith('<ul>')?m:'<ol>'+m+'</ol>');
  return h.split(/\n{2,}/).map(p=>p.match(/^<[ou]l>/)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}

document.getElementById('f').addEventListener('submit', ask);
q.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(e); } });

async function ask(e) {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || send.disabled) return;
  q.value=''; send.disabled = true;
  el('msg user', esc(text));
  history.push({role:'user', content:text});

  let bubble = null, answer = '', statusEl = null;
  try {
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'status') {
          if (statusEl) statusEl.remove();
          statusEl = el('status', '🔎 ' + esc(ev.text));
        } else if (ev.type === 'token') {
          if (statusEl) { statusEl.remove(); statusEl = null; }
          if (!bubble) bubble = el('msg bot','');
          answer += ev.text;
          bubble.innerHTML = md(answer);
          bubble.scrollIntoView({block:'end'});
        } else if (ev.type === 'ungrounded') {
          if (!bubble) bubble = el('msg bot','');
          bubble.innerHTML = md(answer) +
            '<div class="unverified">💭 Answered from the AI\'s built-in knowledge — no library document was used. Treat specifics with care.</div>';
        } else if (ev.type === 'sources' && ev.items.length) {
          if (!bubble) bubble = el('msg bot','');
          bubble.innerHTML = md(answer) + '<div class="sources">' +
            ev.items.map(s=>'<a target="_blank" href="'+s.href+'">📖 '+esc(s.title)+'</a>').join('') + '</div>';
        } else if (ev.type === 'error') {
          if (statusEl) { statusEl.remove(); statusEl = null; }
          el('status error', esc(ev.text));
        }
      }
    }
  } catch (err) {
    el('status error', 'Lost connection to Fieldbook — is it running? (./fieldbook start)');
  }
  if (statusEl) statusEl.remove();
  if (answer) history.push({role:'assistant', content:answer});
  send.disabled = false; q.focus();
}
</script>
</body>
</html>
