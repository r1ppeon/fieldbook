<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldbook Library</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 -apple-system,"SF Pro Text",Helvetica,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:28px 16px 60px; }
  header a { color:var(--dim); text-decoration:none; }
  h1 { font-size:18px; margin:12px 0 6px; color:var(--accent-hi); }
  .free { color:var(--dim); margin-bottom:20px; font-size:14px; }
  h2 { font-size:11px; font-family:'Press Start 2P',monospace; color:var(--accent); letter-spacing:1px; margin:30px 0 10px; }
  .card { padding:14px 16px; margin:10px 0;
          display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .card .info { flex:1; min-width:240px; }
  .card b { font-size:15px; }
  .card p { margin:3px 0 0; color:var(--dim); font-size:13.5px; }
  .size { color:var(--dim); font-size:14px; white-space:nowrap; }
  button { border:0; border-radius:6px; padding:8px 16px; font:600 14px/1 inherit; cursor:pointer; }
  .dl { background:var(--accent); color:#241303; }
  .del { background:transparent; color:var(--bad); border:2px solid var(--bad); }
  .done { color:var(--ok); font-weight:600; font-size:14px; }
  .bar { height:8px; border-radius:4px; background:rgba(128,128,128,.25); width:160px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .5s; }
  .err { color:var(--bad); font-size:13px; }
  .presetrow { display:flex; gap:10px; flex-wrap:wrap; }
  .preset { flex:1; min-width:200px; padding:14px 16px; }
  .preset p { color:var(--dim); font-size:13.5px; margin:4px 0 10px; }
  .offline { background:var(--card); border:1px solid var(--bad); color:var(--bad); border-radius:12px; padding:10px 16px; display:none; margin:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header><a href="/">← Fieldbook</a></header>
  <h1 class="pixel">📦 KNOWLEDGE PACKS</h1>
  <div class="free" id="free"></div>
  <div class="offline" id="offline">⚠️ Can't reach the download catalog — downloads need internet. Everything already installed keeps working offline.</div>

  <h2>Quick presets</h2>
  <div class="presetrow" id="presets"></div>

  <h2>Installed</h2>
  <div id="installed"></div>

  <h2>Available packs</h2>
  <div id="packs"></div>
</div>
<script>
let state = null;

function fmt(bytes){ const g = bytes/2**30; return g >= 1 ? g.toFixed(1)+' GB' : Math.round(bytes/2**20)+' MB'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function refresh() {
  try { state = await (await fetch('/api/library')).json(); } catch(e){ return; }
  render();
}

function jobFor(id){ return state.jobs[id]; }

function render() {
  document.getElementById('free').textContent =
    'Library: ' + state.library_dir + '  ·  Free space: ' + fmt(state.free);

  // Presets
  const pr = document.getElementById('presets');
  pr.innerHTML = Object.entries(state.presets).map(([key,p]) => {
    const missing = p.packs.filter(id => { const k = state.packs.find(x=>x.id===id); return k && !k.installed; });
    return '<div class="preset"><b>'+esc(p.label)+'</b><p>'+esc(p.desc)+'</p>' +
      (missing.length
        ? '<button class="dl" onclick="downloadMany('+JSON.stringify(missing).replace(/"/g,'&quot;')+')">Download '+missing.length+' pack'+(missing.length>1?'s':'')+'</button>'
        : '<span class="done">✓ all installed</span>') + '</div>';
  }).join('');

  // Installed files
  const inst = document.getElementById('installed');
  inst.innerHTML = state.installed.length ? state.installed.map(f =>
    '<div class="card"><div class="info"><b>'+esc(f.file)+'</b></div>' +
    '<span class="size">'+fmt(f.size)+'</span>' +
    '<button class="del" onclick="del(\''+esc(f.file)+'\')">Delete</button></div>'
  ).join('') : '<div class="card"><div class="info"><p>Nothing yet — pick a preset above or packs below.</p></div></div>';

  // Catalog
  let last = null, html = '';
  for (const p of state.packs) {
    if (p.category !== last) { last = p.category; html += '<h2>'+esc(last)+'</h2>'; }
    const job = jobFor(p.id);
    let action;
    if (p.installed) action = '<span class="done">✓ installed</span>';
    else if (job && (job.state === 'downloading' || job.state === 'queued')) {
      const pct = job.total ? Math.min(100, Math.round(100*job.done/job.total)) : 0;
      action = job.state === 'queued' ? '<span class="size">queued…</span>'
        : '<div><div class="bar"><i style="width:'+pct+'%"></i></div><span class="size">'+pct+'% of '+fmt(job.total)+'</span></div>';
    }
    else action = '<button class="dl" onclick="download(\''+p.id+'\')">Download</button>' +
                  (job && job.state === 'error' ? '<div class="err">'+esc(job.msg)+'</div>' : '');
    html += '<div class="card"><div class="info"><b>'+esc(p.title)+'</b><p>'+esc(p.desc)+'</p></div>' +
            '<span class="size">~'+p.approx_gb+' GB</span>'+action+'</div>';
  }
  document.getElementById('packs').innerHTML = html;
}

async function download(id) {
  const p = state.packs.find(x=>x.id===id);
  if (p && p.warn_huge && !confirm(p.title+' is about '+p.approx_gb+' GB. Download it?')) return;
  await post('/api/library/download', {id});
  refresh();
}
async function downloadMany(ids) { await post('/api/library/download', {ids}); refresh(); }
async function del(file) {
  if (!confirm('Delete '+file+'? You can re-download it later.')) return;
  await post('/api/library/delete', {file});
  refresh();
}
async function post(url, body) {
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    return await r.json();
  } catch(e) { document.getElementById('offline').style.display='block'; }
}

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
